name: Android Build & Test

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Mobile Core Library (AAR)"]
    types: [completed]
    branches: [main, dev]

permissions:
  actions: read
  contents: read

jobs:
  build-and-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve AAR workflow run
        id: aar-run
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            RUN_ID="$(gh run list --workflow mobile-lib-build.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            test -n "$RUN_ID"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source used by AAR build
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Download AAR from Mobile Core Library workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd android
          rm -rf ../aar-artifact
          mkdir -p ../aar-artifact
          gh run download "${{ steps.aar-run.outputs.run_id }}" \
            --name ghi-core-aar \
            --dir ../aar-artifact
          test -f ../aar-artifact/ghicore.aar
          rm -rf core/crawlercore/libs core/crawlercore/src/main/jniLibs
          mkdir -p core/crawlercore/libs core/crawlercore/src/main/jniLibs
          unzip -q ../aar-artifact/ghicore.aar -d ../aar-artifact/ghicore-expanded
          test -f ../aar-artifact/ghicore-expanded/classes.jar
          cp ../aar-artifact/ghicore-expanded/classes.jar core/crawlercore/libs/ghicore-classes.jar
          test -d ../aar-artifact/ghicore-expanded/jni/armeabi-v7a
          test -d ../aar-artifact/ghicore-expanded/jni/arm64-v8a
          cp -a ../aar-artifact/ghicore-expanded/jni/. core/crawlercore/src/main/jniLibs/

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Install Android SDK tools for native alignment checks
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;37.0.0 ndk;29.0.14206865"

      - name: Unit tests
        run: cd android && gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug APK
        run: cd android && gradle assembleDebug --stacktrace --no-daemon

      - name: Verify native ABIs and 16 KB page-size compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd android

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"

          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libgojni.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so'
          echo "Verified: APK contains armeabi-v7a + arm64-v8a native libraries"

          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          LLVM_READelf="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          ZIPALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          test -x "$LLVM_READelf"
          test -x "$ZIPALIGN"

          rm -rf "$RUNNER_TEMP/ghi-page-size-check"
          mkdir -p "$RUNNER_TEMP/ghi-page-size-check"
          unzip -p "$APK" lib/arm64-v8a/libgojni.so \
            > "$RUNNER_TEMP/ghi-page-size-check/libgojni-arm64.so"
          unzip -p "$APK" lib/armeabi-v7a/libgojni.so \
            > "$RUNNER_TEMP/ghi-page-size-check/libgojni-arm32.so"

          LIB="$RUNNER_TEMP/ghi-page-size-check/libgojni-arm64.so"
          echo "Checking 64-bit ELF LOAD alignment: $LIB"
          "$LLVM_READelf" -lW "$LIB" \
            | awk '$1 == "LOAD" { print $NF }' \
            > "$RUNNER_TEMP/ghi-page-size-check/alignments.txt"
          test -s "$RUNNER_TEMP/ghi-page-size-check/alignments.txt"

          while IFS= read -r ALIGNMENT; do
            case "$ALIGNMENT" in
              0x*) VALUE=$((16#${ALIGNMENT#0x})) ;;
              *) echo "::error::Unrecognized ELF alignment: $ALIGNMENT"; exit 1 ;;
            esac
            if [ "$VALUE" -lt 16384 ]; then
              echo "::error::ARM64 ELF LOAD segment alignment is below 16 KB: $ALIGNMENT"
              exit 1
            fi
          done < "$RUNNER_TEMP/ghi-page-size-check/alignments.txt"

          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          echo "Verified: both native ABIs have 16 KB ELF alignment and APK ZIP alignment."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghi-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
