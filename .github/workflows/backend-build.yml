name: Backend Build & Test

on:
  workflow_dispatch: {}
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ghi
          POSTGRES_PASSWORD: ghi
          POSTGRES_DB: ghi
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ghi -d ghi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.10
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: cd backend && go mod download

      - name: Normalize Go module metadata
        run: cd backend && go mod tidy

      - name: Vet
        run: cd backend && go vet ./...

      - name: Run migrations
        run: |
          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.18.1 \
            -path=/migrations \
            -database="postgres://ghi:ghi@localhost:5432/ghi?sslmode=disable" \
            up

      - name: Test
        env:
          GHI_POSTGRES_DSN: "postgres://ghi:ghi@localhost:5432/ghi?sslmode=disable"
          GHI_REDIS_ADDR: "localhost:6379"
        run: cd backend && go test ./... -race -v

      - name: Build server + worker
        run: |
          cd backend
          mkdir -p bin
          go build -o bin/server ./cmd/server
          go build -o bin/worker ./cmd/worker

      - name: Upload backend binaries
        uses: actions/upload-artifact@v4
        with:
          name: ghi-backend-binaries
          path: backend/bin/*
