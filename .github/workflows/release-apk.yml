name: GHI Release APK

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Mobile Core Library (AAR)"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ghi-release-apk
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve matching AAR run
        id: aar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SOURCE_SHA="${{ github.sha }}"
            RUN_ID="$(gh run list --workflow mobile-lib-build.yml --branch main --status success --limit 100 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId" | head -n 1)"
            test -n "$RUN_ID" || { echo "::error::No successful AAR build exists for $SOURCE_SHA"; exit 1; }
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact AAR source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.aar.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify exact source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.aar.outputs.source_sha }}"

      - name: Download matching AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aar"
          gh run download "${{ steps.aar.outputs.run_id }}" --name ghi-core-aar --dir "$RUNNER_TEMP/aar"
          test -s "$RUNNER_TEMP/aar/ghicore.aar"

      - name: Inject matching AAR
        run: |
          set -euo pipefail
          cd android
          rm -rf core/crawlercore/libs core/crawlercore/src/main/jniLibs
          mkdir -p core/crawlercore/libs core/crawlercore/src/main/jniLibs
          mkdir -p "$RUNNER_TEMP/aar-expanded"
          unzip -q "$RUNNER_TEMP/aar/ghicore.aar" -d "$RUNNER_TEMP/aar-expanded"
          test -s "$RUNNER_TEMP/aar-expanded/classes.jar"
          test -d "$RUNNER_TEMP/aar-expanded/jni/armeabi-v7a"
          test -d "$RUNNER_TEMP/aar-expanded/jni/arm64-v8a"
          cp "$RUNNER_TEMP/aar-expanded/classes.jar" core/crawlercore/libs/ghicore-classes.jar
          cp -a "$RUNNER_TEMP/aar-expanded/jni/." core/crawlercore/src/main/jniLibs/

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
          cache-read-only: false

      - name: Decode single release signing bundle
        env:
          GHI_RELEASE_BUNDLE_B64: ${{ secrets.GHI_RELEASE_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "$GHI_RELEASE_BUNDLE_B64" || { echo "::error::Missing GHI_RELEASE_BUNDLE_B64 repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ghi-signing"
          printf '%s' "$GHI_RELEASE_BUNDLE_B64" | base64 --decode > "$RUNNER_TEMP/ghi-signing/bundle.env"
          chmod 600 "$RUNNER_TEMP/ghi-signing/bundle.env"
          grep -q '^GHI_RELEASE_STORE_PASSWORD=' "$RUNNER_TEMP/ghi-signing/bundle.env"
          grep -q '^GHI_RELEASE_KEY_ALIAS=' "$RUNNER_TEMP/ghi-signing/bundle.env"
          grep -q '^GHI_RELEASE_KEY_PASSWORD=' "$RUNNER_TEMP/ghi-signing/bundle.env"
          grep -q '^GHI_RELEASE_KEYSTORE_B64=' "$RUNNER_TEMP/ghi-signing/bundle.env"

      - name: Restore and validate release keystore
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/ghi-signing/bundle.env"
          STORE_PASSWORD="$(sed -n 's/^GHI_RELEASE_STORE_PASSWORD=//p' "$BUNDLE")"
          KEY_ALIAS="$(sed -n 's/^GHI_RELEASE_KEY_ALIAS=//p' "$BUNDLE")"
          KEY_PASSWORD="$(sed -n 's/^GHI_RELEASE_KEY_PASSWORD=//p' "$BUNDLE")"
          KEYSTORE_B64="$(sed -n 's/^GHI_RELEASE_KEYSTORE_B64=//p' "$BUNDLE")"
          test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"; test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ghi-signing/GlobalHostInteligence-release.keystore"
          test -s "$RUNNER_TEMP/ghi-signing/GlobalHostInteligence-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/ghi-signing/GlobalHostInteligence-release.keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "GHI_RELEASE_STORE_FILE=$RUNNER_TEMP/ghi-signing/GlobalHostInteligence-release.keystore"
            echo "GHI_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "GHI_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "GHI_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          rm -f "$BUNDLE"

      - name: Unit tests
        run: cd android && gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble signed release APK
        run: cd android && gradle assembleRelease --stacktrace --no-daemon

      - name: Verify release APK
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libgojni.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so'
          echo "Verified signed release APK: $APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ghi-release-apk-v2.4.1
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
