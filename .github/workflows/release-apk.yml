name: GHI No-Ads Release APK

on:
  push:
    branches: [no-ads-release]
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: ghi-no-ads-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching AAR build
        id: aar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.sha }}"
          echo "Waiting for successful AAR build for $SOURCE_SHA"
          for i in $(seq 1 90); do
            RUN_ID="$(gh run list --workflow mobile-lib-build.yml --branch no-ads-release --status success --limit 100 --json databaseId,headSha --jq ".[] | select(.headSha == \\"$SOURCE_SHA\\") | .databaseId" | head -n 1)"
            if [ -n "$RUN_ID" ]; then
              echo "Found matching AAR run: $RUN_ID"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "AAR not ready: attempt $i/90"
            sleep 10
          done
          echo "::error::No successful AAR build found for $SOURCE_SHA"
          exit 1

      - name: Checkout exact AAR source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.aar.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify exact source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.aar.outputs.source_sha }}"

      - name: Download matching AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aar"
          gh run download "${{ steps.aar.outputs.run_id }}" --name ghi-core-aar --dir "$RUNNER_TEMP/aar"
          test -s "$RUNNER_TEMP/aar/ghicore.aar"

      - name: Inject matching AAR
        run: |
          set -euo pipefail
          cd android
          rm -rf core/crawlercore/libs core/crawlercore/src/main/jniLibs
          mkdir -p core/crawlercore/libs core/crawlercore/src/main/jniLibs
          mkdir -p "$RUNNER_TEMP/aar-expanded"
          unzip -q "$RUNNER_TEMP/aar/ghicore.aar" -d "$RUNNER_TEMP/aar-expanded"
          test -s "$RUNNER_TEMP/aar-expanded/classes.jar"
          test -d "$RUNNER_TEMP/aar-expanded/jni/armeabi-v7a"
          test -d "$RUNNER_TEMP/aar-expanded/jni/arm64-v8a"
          cp "$RUNNER_TEMP/aar-expanded/classes.jar" core/crawlercore/libs/ghicore-classes.jar
          cp -a "$RUNNER_TEMP/aar-expanded/jni/." core/crawlercore/src/main/jniLibs/

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
          cache-read-only: false

      - name: Restore release keystore
        env:
          GHI_RELEASE_KEYSTORE_B64: ${{ secrets.GHI_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$GHI_RELEASE_KEYSTORE_B64"
          mkdir -p "$RUNNER_TEMP/ghi-signing"
          printf "%s" "$GHI_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ghi-signing/GlobalHostInteligence-release.keystore"
          test -s "$RUNNER_TEMP/ghi-signing/GlobalHostInteligence-release.keystore"

      - name: Create Android local.properties
        env:
          LOCAL_PROPERTIES_B64: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          test -n "$LOCAL_PROPERTIES_B64"
          printf "%s" "$LOCAL_PROPERTIES_B64" | base64 --decode > android/local.properties
          test -s android/local.properties

      - name: Prepare release signing
        env:
          LOCAL_PROPERTIES_B64: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(printf "%s" "$LOCAL_PROPERTIES_B64" | base64 --decode | sed -n "s/^GHI_RELEASE_STORE_PASSWORD=//p")"
          KEY_ALIAS="$(printf "%s" "$LOCAL_PROPERTIES_B64" | base64 --decode | sed -n "s/^GHI_RELEASE_KEY_ALIAS=//p")"
          KEY_PASSWORD="$(printf "%s" "$LOCAL_PROPERTIES_B64" | base64 --decode | sed -n "s/^GHI_RELEASE_KEY_PASSWORD=//p")"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "GHI_RELEASE_STORE_FILE=$RUNNER_TEMP/ghi-signing/GlobalHostInteligence-release.keystore"
            echo "GHI_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "GHI_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "GHI_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: cd android && gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble signed release APK
        run: cd android && gradle assembleRelease --stacktrace --no-daemon

      - name: Verify release APK
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libgojni.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgojni.so"
          echo "Verified signed release APK: $APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ghi-no-ads-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
