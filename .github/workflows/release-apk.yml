name: GHI Release APK

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Mobile Core Library (AAR)"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ghi-release-apk
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve AAR workflow run
        id: aar-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            RUN_ID="$(gh run list --workflow mobile-lib-build.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            test -n "$RUN_ID"
            SOURCE_SHA="$(gh run view "$RUN_ID" --json headSha --jq '.headSha')"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source used by AAR build
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.aar-run.outputs.source_sha }}
          fetch-depth: 1

      - name: Download matching GHI core AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd android
          rm -rf ../aar-artifact
          mkdir -p ../aar-artifact
          gh run download "${{ steps.aar-run.outputs.run_id }}" --name ghi-core-aar --dir ../aar-artifact
          test -f ../aar-artifact/ghicore.aar
          rm -rf core/crawlercore/libs core/crawlercore/src/main/jniLibs
          mkdir -p core/crawlercore/libs core/crawlercore/src/main/jniLibs
          unzip -q ../aar-artifact/ghicore.aar -d ../aar-artifact/ghicore-expanded
          test -f ../aar-artifact/ghicore-expanded/classes.jar
          cp ../aar-artifact/ghicore-expanded/classes.jar core/crawlercore/libs/ghicore-classes.jar
          test -d ../aar-artifact/ghicore-expanded/jni/armeabi-v7a
          test -d ../aar-artifact/ghicore-expanded/jni/arm64-v8a
          cp -a ../aar-artifact/ghicore-expanded/jni/. core/crawlercore/src/main/jniLibs/

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
          cache-read-only: false

      - name: Restore release keystore
        env:
          GHI_RELEASE_KEYSTORE_B64: ${{ secrets.GHI_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$GHI_RELEASE_KEYSTORE_B64"
          mkdir -p "$RUNNER_TEMP/ghi-signing"
          printf '%s' "$GHI_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ghi-signing/GlobalHostInteligence-release.keystore"
          test -s "$RUNNER_TEMP/ghi-signing/GlobalHostInteligence-release.keystore"

      - name: Unit tests
        env:
          GHI_RELEASE_STORE_FILE: ${{ runner.temp }}/ghi-signing/GlobalHostInteligence-release.keystore
          GHI_RELEASE_STORE_PASSWORD: ${{ secrets.GHI_RELEASE_STORE_PASSWORD }}
          GHI_RELEASE_KEY_ALIAS: ${{ secrets.GHI_RELEASE_KEY_ALIAS }}
          GHI_RELEASE_KEY_PASSWORD: ${{ secrets.GHI_RELEASE_KEY_PASSWORD }}
        run: cd android && gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build signed release APK
        env:
          GHI_RELEASE_STORE_FILE: ${{ runner.temp }}/ghi-signing/GlobalHostInteligence-release.keystore
          GHI_RELEASE_STORE_PASSWORD: ${{ secrets.GHI_RELEASE_STORE_PASSWORD }}
          GHI_RELEASE_KEY_ALIAS: ${{ secrets.GHI_RELEASE_KEY_ALIAS }}
          GHI_RELEASE_KEY_PASSWORD: ${{ secrets.GHI_RELEASE_KEY_PASSWORD }}
        run: cd android && gradle assembleRelease --stacktrace --no-daemon

      - name: Verify release APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libgojni.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so'
          echo "Verified native ABIs: armeabi-v7a + arm64-v8a"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ghi-release-apk-v2.4.1
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
