
name: GHI Complete CI - Backend, Core & Android

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - dev
      - no-ads-release
      - upgrade/ghi-5-ui-engine

  pull_request:
    branches:
      - main
      - dev
      - upgrade/ghi-5-ui-engine

permissions:
  contents: read

concurrency:
  group: ghi-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghi-complete:
    name: Backend + Mobile Core + Android + Release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ghi
          POSTGRES_PASSWORD: ghi
          POSTGRES_DB: ghi
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ghi -d ghi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.10
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ==========================================
      # 1. SOURCE CHECKOUT
      # ==========================================

      - name: Checkout GHI source
        uses: actions/checkout@v5

      # ==========================================
      # 2. TOOLCHAIN SETUP
      # ==========================================

      - name: Setup Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: backend/go.sum

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 platforms;android-37 build-tools;37.0.0"

      - name: Install Android NDK r29
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;29.0.14206865"

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/29.0.14206865"

          test -d "$NDK_ROOT"
          test -f "${ANDROID_SDK_ROOT}/platforms/android-35/android.jar"
          test -f "${ANDROID_SDK_ROOT}/platforms/android-37/android.jar"
          test -d "${ANDROID_SDK_ROOT}/build-tools/37.0.0"

          {
            echo "ANDROID_HOME=${ANDROID_SDK_ROOT}"
            echo "ANDROID_SDK_HOME=${ANDROID_SDK_ROOT}"
            echo "ANDROID_NDK_HOME=${NDK_ROOT}"
            echo "ANDROID_NDK_ROOT=${NDK_ROOT}"
          } >> "$GITHUB_ENV"

          echo "Android SDK configured."
          echo "Android API: 37"
          echo "Gomobile API: 35"
          echo "NDK: ${NDK_ROOT}"

      # ==========================================
      # 3. BACKEND BUILD AND TEST
      # ==========================================

      - name: Download backend modules
        working-directory: backend
        run: go mod download

      - name: Normalize Go module metadata
        working-directory: backend
        run: go mod tidy

      - name: Run Go vet
        working-directory: backend
        run: go vet ./...

      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.18.1 \
            -path=/migrations \
            -database="postgres://ghi:ghi@localhost:5432/ghi?sslmode=disable" \
            up

      - name: Run backend tests
        working-directory: backend
        env:
          GHI_POSTGRES_DSN: "postgres://ghi:ghi@localhost:5432/ghi?sslmode=disable"
          GHI_REDIS_ADDR: "localhost:6379"
        run: go test ./... -race -v

      - name: Build backend server and worker
        shell: bash
        run: |
          set -euo pipefail

          cd backend
          mkdir -p bin

          go build -o bin/server ./cmd/server
          go build -o bin/worker ./cmd/worker

      - name: Upload backend binaries
        uses: actions/upload-artifact@v4
        with:
          name: ghi-backend-binaries
          path: backend/bin/*
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 4. MOBILE CORE TESTS
      # ==========================================

      - name: Test mobile discovery core
        working-directory: backend
        run: go test ./mobile -count=1

      - name: Install pinned Go Mobile toolchain
        shell: bash
        run: |
          set -euo pipefail

          cd backend

          MOBILE_VERSION="v0.0.0-20261011034528-197770444867"

          go get "golang.org/x/mobile@${MOBILE_VERSION}"

          go install "golang.org/x/mobile/cmd/gomobile@${MOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}"

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialize Gomobile
        shell: bash
        run: |
          set -euo pipefail

          gomobile version
          gobind -h >/dev/null
          gomobile init

      - name: Verify Android native toolchain
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$NDK/clang"
          test -x "$NDK/armv7a-linux-androideabi21-clang"
          test -x "$NDK/aarch64-linux-android21-clang"

          test -f "${ANDROID_SDK_ROOT}/platforms/android-35/android.jar"

          go version
          gomobile version
          adb version

          echo "Android ARM32 and ARM64 toolchains verified."

      # ==========================================
      # 5. BUILD MOBILE CORE AAR
      # ==========================================

      - name: Build ARM32 and ARM64 mobile library
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -euo pipefail

          cd backend

          rm -f ghicore.aar

          gomobile clean || true
          gomobile init

          gomobile bind \
            -target=android/arm,android/arm64 \
            -androidapi 35 \
            -javapkg=io.ciphertun.ghi.core.crawlercore.generated \
            -o ghicore.aar \
            ./mobile

          test -s ghicore.aar

          ls -lh ghicore.aar

      - name: Verify AAR native libraries and API
        shell: bash
        run: |
          set -euo pipefail

          cd backend

          test -s ghicore.aar

          unzip -l ghicore.aar | grep -q \
            "jni/armeabi-v7a/libgojni.so"

          unzip -l ghicore.aar | grep -q \
            "jni/arm64-v8a/libgojni.so"

          mkdir -p "$RUNNER_TEMP/ghi-aar-check"

          unzip -p ghicore.aar classes.jar \
            > "$RUNNER_TEMP/ghi-aar-check/ghi-classes.jar"

          CLASS="io.ciphertun.ghi.core.crawlercore.generated.mobile.Mobile"

          jar tf "$RUNNER_TEMP/ghi-aar-check/ghi-classes.jar" \
            | grep -qx \
            "io/ciphertun/ghi/core/crawlercore/generated/mobile/Mobile.class"

          javap -classpath "$RUNNER_TEMP/ghi-aar-check/ghi-classes.jar" "$CLASS" \
            > "$RUNNER_TEMP/ghi-aar-check/api.txt"

          for API in \
            "ping()" \
            "resolveDomain(java.lang.String)" \
            "discover(java.lang.String" \
            "analyzeHost(java.lang.String)" \
            "generateRequest(java.lang.String" \
            "checkHost(java.lang.String" \
            "checkResponse(java.lang.String" \
            "resolveIP(java.lang.String"
          do
            grep -Fq "$API" "$RUNNER_TEMP/ghi-aar-check/api.txt"
          done

          echo "Verified ARM32, ARM64 and mobile API bindings."

      - name: Upload mobile core AAR
        uses: actions/upload-artifact@v4
        with:
          name: ghi-core-aar
          path: backend/ghicore.aar
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 6. INJECT FRESH AAR INTO ANDROID
      # ==========================================

      - name: Inject freshly compiled mobile library
        shell: bash
        run: |
          set -euo pipefail

          cd android

          rm -rf \
            core/crawlercore/libs \
            core/crawlercore/src/main/jniLibs

          mkdir -p \
            core/crawlercore/libs \
            core/crawlercore/src/main/jniLibs

          rm -rf ../.ci-aar-expanded
          mkdir -p ../.ci-aar-expanded

          unzip -q ../backend/ghicore.aar -d ../.ci-aar-expanded

          test -s ../.ci-aar-expanded/classes.jar
          test -d ../.ci-aar-expanded/jni/armeabi-v7a
          test -d ../.ci-aar-expanded/jni/arm64-v8a

          cp ../.ci-aar-expanded/classes.jar \
            core/crawlercore/libs/ghicore-classes.jar

          cp -a ../.ci-aar-expanded/jni/. \
            core/crawlercore/src/main/jniLibs/

          echo "Fresh AAR injected into Android project."

      # ==========================================
      # 7. VERIFY ANDROID CONFIGURATION
      # ==========================================

      - name: Verify release configuration and production ads
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'isMinifyEnabled = false' \
            android/app/build.gradle.kts

          grep -q 'isShrinkResources = false' \
            android/app/build.gradle.kts

          if grep -R -nE \
            'isMinifyEnabled[[:space:]]*=[[:space:]]*true|minifyEnabled[[:space:]]+true|shrinkResources[[:space:]]*=[[:space:]]*true|com\.android\.tools\.r8' \
            android \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.properties' \
            --include='*.pro'
          then
            echo "::error::R8/minification configuration detected."
            exit 1
          fi

          test -f android/app/src/main/java/io/ciphertun/ghi/app/GhiAdManager.kt
          test -f android/app/src/main/java/io/ciphertun/ghi/app/GhiAdBanner.kt

          grep -q 'play-services-ads:25.5.0' \
            android/app/build.gradle.kts

          grep -q 'user-messaging-platform:4.0.0' \
            android/app/build.gradle.kts

          grep -q 'ca-app-pub-3583424243110322~5967822096' \
            android/app/src/main/AndroidManifest.xml

          grep -q 'ca-app-pub-3583424243110322/3774929712' \
            android/app/src/main/java/io/ciphertun/ghi/app/GhiAdManager.kt

          grep -q 'ca-app-pub-3583424243110322/6485592223' \
            android/app/src/main/java/io/ciphertun/ghi/app/GhiAdBanner.kt

          echo "Production AdMob configuration verified."

      # ==========================================
      # 8. ANDROID UNIT TESTS
      # ==========================================

      - name: Run Android unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      # ==========================================
      # 9. ANDROID DEBUG APK
      # ==========================================

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK and native ABIs
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          test -n "$APK"
          test -s "$APK"

          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libgojni.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so'

          NDK="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          READelf="$NDK/llvm-readelf"
          ZIPALIGN="${ANDROID_HOME}/build-tools/37.0.0/zipalign"

          test -x "$READelf"
          test -x "$ZIPALIGN"

          CHECK_DIR="$RUNNER_TEMP/ghi-page-size-check"
          mkdir -p "$CHECK_DIR"

          for ABI in arm64-v8a armeabi-v7a
          do
            LIB="$CHECK_DIR/libgojni-${ABI}.so"

            unzip -p "$APK" "lib/${ABI}/libgojni.so" > "$LIB"

            test -s "$LIB"

            "$READelf" -lW "$LIB" |
              awk '$1 == "LOAD" { print $NF }' \
              > "$CHECK_DIR/alignments.txt"

            test -s "$CHECK_DIR/alignments.txt"

            while IFS= read -r ALIGNMENT
            do
              case "$ALIGNMENT" in
                0x*)
                  VALUE=$((16#${ALIGNMENT#0x}))
                  ;;
                *)
                  echo "::error::Invalid ELF alignment: $ALIGNMENT"
                  exit 1
                  ;;
              esac

              if [ "$VALUE" -lt 16384 ]; then
                echo "::error::${ABI} ELF alignment below 16 KB: $ALIGNMENT"
                exit 1
              fi
            done < "$CHECK_DIR/alignments.txt"
          done

          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          echo "Debug APK native ABI and alignment verification passed."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghi-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 10. RELEASE SIGNING
      # ==========================================

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          GHI_RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$GHI_RELEASE_KEYSTORE_B64"

          mkdir -p .ci-signing

          printf "%s" "$GHI_RELEASE_KEYSTORE_B64" \
            | base64 --decode \
            > .ci-signing/GlobalHostInteligence-release.keystore

          test -s .ci-signing/GlobalHostInteligence-release.keystore

      - name: Restore signing properties
        if: github.event_name != 'pull_request'
        env:
          LOCAL_PROPERTIES_B64: ${{ secrets.LOCAL_PROPERTIES }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$LOCAL_PROPERTIES_B64"

          printf "%s" "$LOCAL_PROPERTIES_B64" \
            | base64 --decode \
            > android/local.properties

          test -s android/local.properties

      - name: Prepare release signing environment
        if: github.event_name != 'pull_request'
        env:
          LOCAL_PROPERTIES_B64: ${{ secrets.LOCAL_PROPERTIES }}
        shell: bash
        run: |
          set -euo pipefail

          PROPS="$(printf "%s" "$LOCAL_PROPERTIES_B64" | base64 --decode)"

          STORE_PASSWORD="$(printf "%s\n" "$PROPS" \
            | sed -n 's/^GHI_RELEASE_STORE_PASSWORD=//p')"

          KEY_ALIAS="$(printf "%s\n" "$PROPS" \
            | sed -n 's/^GHI_RELEASE_KEY_ALIAS=//p')"

          KEY_PASSWORD="$(printf "%s\n" "$PROPS" \
            | sed -n 's/^GHI_RELEASE_KEY_PASSWORD=//p')"

          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

          {
            echo "GHI_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/.ci-signing/GlobalHostInteligence-release.keystore"
            echo "GHI_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "GHI_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "GHI_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # ==========================================
      # 11. FRESH SIGNED RELEASE APK
      # ==========================================

      - name: Build fresh signed release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          gradle clean assembleRelease \
            --stacktrace \
            --no-daemon \
            --no-build-cache \
            --refresh-dependencies \
            --rerun-tasks \
            --console=plain

      - name: Verify release contains no R8 output
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          if find android/app/build -type f \
            \( \
              -name '*mapping.txt' \
              -o -name '*usage.txt' \
              -o -name '*seeds.txt' \
            \) | grep -q .; then
            echo "::error::Unexpected R8 output detected."
            exit 1
          fi

          echo "R8 output verification passed."

      - name: Verify signed release APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK"
          test -s "$APK"

          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'

          APKSIGNER="${ANDROID_HOME}/build-tools/37.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          echo "Signed release APK verified."
          ls -lh "$APK"

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ghi-release-apk-ads-no-r8
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 12. CLEANUP
      # ==========================================

      - name: Cleanup temporary signing material
        if: always()
        shell: bash
        run: |
          rm -rf \
            .ci-signing \
            .ci-aar-expanded

          rm -f android/local.properties
