      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 platforms;android-37.0 build-tools;37.0.0"

      - name: Install Android NDK r29
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install "ndk;29.0.14206865"

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/29.0.14206865"

          echo "Checking Android SDK and NDK installations..."

          test -d "$NDK_ROOT"
          test -f "${ANDROID_SDK_ROOT}/platforms/android-35/android.jar"
          test -f "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
          test -d "${ANDROID_SDK_ROOT}/build-tools/37.0.0"

          # Provide the android-37 path expected by the project.
          if [ ! -e "${ANDROID_SDK_ROOT}/platforms/android-37" ]; then
            ln -s android-37.0 "${ANDROID_SDK_ROOT}/platforms/android-37"
          fi

          test -f "${ANDROID_SDK_ROOT}/platforms/android-37/android.jar"

          {
            echo "ANDROID_HOME=${ANDROID_SDK_ROOT}"
            echo "ANDROID_SDK_HOME=${ANDROID_SDK_ROOT}"
            echo "ANDROID_NDK_HOME=${NDK_ROOT}"
            echo "ANDROID_NDK_ROOT=${NDK_ROOT}"
          } >> "$GITHUB_ENV"

          echo "Android SDK configuration verified."
          echo "Android SDK: ${ANDROID_SDK_ROOT}"
          echo "Android API 35: installed"
          echo "Android API 37: installed"
          echo "Android Build Tools: 37.0.0"
          echo "Android NDK: 29.0.14206865"