name: global-host-intelligence

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ghi
      POSTGRES_PASSWORD: ghi
      POSTGRES_DB: ghi
    ports:
      - "5432:5432"
    volumes:
      - ghi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghi -d ghi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://ghi:ghi@postgres:5432/ghi?sslmode=disable",
        "up"
      ]
    restart: "no"

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GHI_POSTGRES_DSN: "postgres://ghi:ghi@postgres:5432/ghi?sslmode=disable"
      GHI_REDIS_ADDR: "redis:6379"
    ports:
      - "8080:8080"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GHI_POSTGRES_DSN: "postgres://ghi:ghi@postgres:5432/ghi?sslmode=disable"
      GHI_REDIS_ADDR: "redis:6379"

volumes:
  ghi_postgres_data:
